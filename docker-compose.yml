services:
  api:
    build: ./api
    environment:
      DATA_DIR: /data
      ADDR: :8080
    volumes:
      - delivery-data:/data
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api

  verify:
    build: ./verify
    environment:
      API_URL: http://api:8080
      DATA_DIR: /data
    volumes:
      - delivery-data:/data:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  delivery-data:
