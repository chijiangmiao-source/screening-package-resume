services:
  api:
    build: ./api
    environment:
      DATA_DIR: /data
      ADDR: :8080
    volumes:
      - delivery-data:/data
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api

  # Second API process over the SAME data volume, started only for the
  # acceptance run (verify profile). It stands in for a restarted api:
  # verify writes through `api`, then opens SSE / uploads through this peer
  # to prove the persisted progress sequence survives across processes and
  # keeps increasing. Auto-activates when `verify` starts; plain
  # `docker compose up` never starts it.
  api-peer:
    build: ./api
    profiles: ["verify"]
    environment:
      DATA_DIR: /data
      ADDR: :8080
    volumes:
      - delivery-data:/data
    depends_on:
      api:
        condition: service_healthy

  verify:
    build: ./verify
    # One-shot acceptance container. Without this profile it would be part of
    # the default `docker compose up` target set, but it depends on api-peer
    # (which itself only exists under this profile) — Compose would then abort
    # with a missing-dependency error. Keeping both on the same profile means
    # a plain `up` starts only web + api, while `--profile verify up` starts
    # api, api-peer and this one-shot verifier together.
    profiles: ["verify"]
    environment:
      API_URL: http://api:8080
      API_PEER_URL: http://api-peer:8080
      DATA_DIR: /data
    volumes:
      # Read-write: the reuse-fallback scenario must corrupt/remove a
      # candidate artifact on the volume to prove the server declines it.
      - delivery-data:/data
    depends_on:
      api:
        condition: service_healthy
      api-peer:
        condition: service_started

volumes:
  delivery-data:
