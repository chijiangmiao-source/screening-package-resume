server {
    listen 80;
    server_name _;

    # 1 MiB chunk + JSON overhead; reject anything larger at the edge.
    client_max_body_size 2m;

    # Progress event stream (SSE): never buffer events and keep the
    # long-lived connection open; the API sends a heartbeat every 15s.
    location ~ ^/api/sessions/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
